# benchlens with its database in a named volume.
#   BENCHLENS_TOKEN=$(openssl rand -hex 32) docker compose up -d        then open http://localhost:8080
# The server listens on 0.0.0.0 inside the container (not loopback), so without BENCHLENS_TOKEN it is read-only:
# upload, tag editing and delete answer 403. With it, they need the token (the web UI asks once per tab).
#   docker compose run --rm -v "$PWD/results:/results:ro" benchlens import /results
services:
  benchlens:
    image: ghcr.io/chaloemph/benchlens:latest
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      BENCHLENS_DB: /data/benchlens.db
      BENCHLENS_LISTEN: 0.0.0.0:8080
      # Write token, at least 16 characters; taken from the shell or an .env file next to this file.
      BENCHLENS_TOKEN: ${BENCHLENS_TOKEN:-}
      # BENCHLENS_READ_PUBLIC: "false"   # reads need the token too
      # Inbox: result folders and .tar/.tar.gz archives dropped into ./inbox are imported, then moved to
      # ./inbox/done or ./inbox/failed. Uncomment this and the mount below; ./inbox must be writable by uid 65532.
      # BENCHLENS_INBOX: /data/inbox
      # BENCHLENS_REGISTRY: /data/registry.tsv   # tags for inbox imports and uploads (a mounted file)
      # BENCHLENS_ALLOWED_HOSTS: bench.lan       # without a token, Host names served besides localhost and IPs
    volumes:
      - benchlens-data:/data
      # - ./inbox:/data/inbox

  # Grafana on the benchlens database, read-only (deploy/grafana/README.md). Only with the profile:
  #   GRAFANA_ADMIN_PASSWORD=... docker compose --profile grafana up -d     then log in at http://localhost:3000
  # Grafana does not go through benchlens' token or read_public: whoever logs in (or, with GRAFANA_ANONYMOUS=true,
  # whoever reaches the port) sees every run. Do not expose it for a private benchlens.
  # Graphs and tables only: verdicts (better / worse / within noise) are computed by benchlens, not in SQL.
  grafana:
    image: grafana/grafana:13.3.1
    profiles: [grafana]
    restart: unless-stopped
    depends_on: [benchlens]
    ports:
      # Local only by default: with the default admin password Grafana should not be reachable from other
      # machines. On a server: set GRAFANA_ADMIN_PASSWORD, keep GRAFANA_ANONYMOUS off unless the data is for
      # everyone, then GRAFANA_BIND=0.0.0.0, ideally behind a TLS proxy.
      - "${GRAFANA_BIND:-127.0.0.1}:3000:3000"
    environment:
      # the SQLite datasource plugin, installed at start (needs network on first start), version pinned
      GF_PLUGINS_PREINSTALL_SYNC: frser-sqlite-datasource@4.0.6
      # off by default: a login is needed. GRAFANA_ANONYMOUS=true lets anyone who reaches port 3000 look (Viewer)
      # without logging in, for a local machine; anonymous viewers can query the whole database
      GF_AUTH_ANONYMOUS_ENABLED: ${GRAFANA_ANONYMOUS:-false}
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_USER: admin
      # default `admin` so that `docker compose up` works without the profile's variables. CHANGE IT: set
      # GRAFANA_ADMIN_PASSWORD before the first start (Grafana keeps the first password in grafana-data)
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/benchlens/metric-over-time.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
    volumes:
      # the benchlens database, read-only (SQLite WAL on a read-only mount: see deploy/grafana/README.md)
      - benchlens-data:/var/lib/benchlens:ro
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/etc/grafana/dashboards/benchlens:ro
      - grafana-data:/var/lib/grafana

volumes:
  benchlens-data:
  grafana-data:
