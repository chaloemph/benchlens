# Development stand-in for the benchlens API (docs/api.md), built on benchlens-core so every number is the
# real code's. Not part of the workspace and not used in production: `benchlens serve` (crates/server) is.
[package]
name = "benchlens-webdev"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
benchlens-core = { path = "../../../crates/core" }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
serde = "1"
serde_json = "1"
