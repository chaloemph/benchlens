name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all
      - name: rules crate builds for WebAssembly
        run: cargo build -p benchlens-rules --target wasm32-unknown-unknown
      - name: cache wasm-bindgen-cli
        id: wasm-bindgen-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-cli-0.2.130-${{ runner.os }}
      - name: install wasm-bindgen-cli (same version as crates/wasm/Cargo.toml)
        if: steps.wasm-bindgen-cache.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: wasm build passes the golden pairs in node
        # the bytes depend on the rustc version, so a differing build only warns
        run: |
          scripts/build-wasm.sh
          git diff --quiet -- web/wasm || echo "::warning::web/wasm differs from a fresh build (rustc $(rustc -V)): rebuild with scripts/build-wasm.sh if crates/rules or crates/wasm changed"
          scripts/test-wasm.sh

  msrv:
    # the workspace `rust-version` (Cargo.toml [workspace.package]); benchlens-rules (1.80) and
    # benchlens-wasm (1.81) state lower versions on purpose, checking the workspace with this one is enough
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: read rust-version from Cargo.toml
        id: msrv
        run: |
          version=$(sed -n '/^\[workspace\.package\]/,/^\[/s/^rust-version *= *"\([0-9.]*\)".*/\1/p' Cargo.toml)
          if [ -z "$version" ]; then
            echo "::error::no rust-version in [workspace.package] of Cargo.toml"
            exit 1
          fi
          echo "MSRV $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv-${{ steps.msrv.outputs.version }}
      - run: cargo +${{ steps.msrv.outputs.version }} check --locked --workspace --all-targets

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: docker build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: benchlens:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e:
    # scripts/e2e.sh: release build, fixtures imported into a temporary database, `benchlens serve`,
    # Playwright suite in tests/e2e (API shapes and errors, every view, numbers on screen = API)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: e2e-release
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - name: npm ci (Playwright, pinned in tests/e2e/package-lock.json)
        working-directory: tests/e2e
        run: npm ci --no-audit --no-fund
      - name: cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/e2e/package-lock.json') }}
      - name: install Chromium and its system libraries
        working-directory: tests/e2e
        run: npx playwright install --with-deps chromium
      - name: end-to-end test
        run: scripts/e2e.sh
      - name: upload screenshots and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: tests/e2e/test-results/
          retention-days: 14
          if-no-files-found: ignore
