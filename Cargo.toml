[workspace]
resolver = "2"
members = ["crates/rules", "crates/core", "crates/server", "crates/cli", "crates/wasm"]

[workspace.package]
version = "0.1.2"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/chaloemph/benchlens"
# 1.89: std File::try_lock (the inbox lock in core); benchlens-rules and benchlens-wasm state their own
rust-version = "1.89"

[workspace.dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["multipart"] }
http-body-util = "0.1"
rust-embed = { version = "8", features = ["mime-guess", "include-exclude"] }
clap = { version = "4.5", features = ["derive", "env"] }
csv = "1.3"
flate2 = "1"
hex = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
toml = { version = "0.8", default-features = false, features = ["parse"] }
subtle = "2.6"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Release build of crates/wasm for the browser (scripts/build-wasm.sh): small over fast.
[profile.wasm]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"
