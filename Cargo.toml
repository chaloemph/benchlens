[workspace]
resolver = "2"
members = ["crates/rules", "crates/core", "crates/server", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/chaloemph/benchlens"
rust-version = "1.80"

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
http-body-util = "0.1"
rust-embed = { version = "8", features = ["mime-guess"] }
clap = { version = "4.5", features = ["derive", "env"] }
csv = "1.3"
flate2 = "1"
hex = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
